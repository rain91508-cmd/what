<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHAT - Web-based HDL Analysis Toolkit</title>
    <style>
      /* Initial loading screen styles */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }
      #initial-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #initial-loader .app-title {
        font-size: 3rem;
        font-weight: bold;
        color: #ffffff;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        margin-bottom: 1rem;
        letter-spacing: 0.1em;
      }
      #initial-loader .app-subtitle {
        font-size: 1.2rem;
        color: #a0a0a0;
        margin-bottom: 2rem;
      }
      #initial-loader .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      #initial-loader .loading-text {
        margin-top: 1rem;
        color: #888;
        font-size: 0.9rem;
      }
      #initial-loader .loading-progress {
        margin-top: 0.5rem;
        color: #666;
        font-size: 0.8rem;
        min-height: 1.2rem;
      }
      #initial-loader .progress-bar {
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        margin-top: 1rem;
        overflow: hidden;
      }
      #initial-loader .progress-bar-fill {
        height: 100%;
        background: #3498db;
        border-radius: 2px;
        transition: width 0.3s ease;
        width: 0%;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      /* Dark background for the app */
      body {
        margin: 0;
        background-color: #1a1a2e;
      }
    </style>
  </head>
  <body>
    <!-- Initial loading screen -->
    <div id="initial-loader">
      <div class="app-title">WHAT</div>
      <div class="app-subtitle">Web-based HDL Analysis Toolkit</div>
      <div class="loading-spinner"></div>
      <div class="loading-text">Initializing...</div>
      <div class="loading-progress" id="loading-progress"></div>
      <div class="progress-bar">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
      </div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
