<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHAT - Web-based HDL Analysis Toolkit</title>
    
    <!-- Pace.js for automatic loading progress - load early for initial loader -->
    <script src="/pace.min.js"></script>
    <style>
      /* Pace.js custom theme - minimal */
      .pace {
        pointer-events: none;
        user-select: none;
      }
      .pace-inactive {
        display: none;
      }
      .pace .pace-progress {
        background: #3498db;
        position: fixed;
        z-index: 2000;
        top: 0;
        right: 100%;
        width: 100%;
        height: 3px;
      }
      
      /* Initial loading screen styles */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }
      #initial-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #initial-loader .app-title {
        font-size: 3rem;
        font-weight: bold;
        color: #ffffff;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        margin-bottom: 1rem;
        letter-spacing: 0.1em;
      }
      #initial-loader .app-subtitle {
        font-size: 1.2rem;
        color: #a0a0a0;
        margin-bottom: 2rem;
      }
      #initial-loader .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      #initial-loader .loading-text {
        margin-top: 1rem;
        color: #888;
        font-size: 0.9rem;
      }
      #initial-loader .pace-progress-container {
        width: 300px;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        margin-top: 1.5rem;
        overflow: hidden;
        position: relative;
      }
      #initial-loader .pace-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #3498db, #2ecc71);
        border-radius: 3px;
        transition: width 0.2s ease-out;
        width: 0%;
        box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
      }
      #initial-loader .pace-percentage {
        margin-top: 0.8rem;
        color: #3498db;
        font-size: 1rem;
        font-weight: bold;
        font-family: monospace;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      /* Dark background for the app */
      body {
        margin: 0;
        background-color: #1a1a2e;
      }
    </style>
  </head>
  <body>
    <!-- Initial loading screen -->
    <div id="initial-loader">
      <div class="app-title">WHAT</div>
      <div class="app-subtitle">Web-based HDL Analysis Toolkit</div>
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading application...</div>
      <div class="pace-progress-container">
        <div class="pace-progress-bar" id="pace-progress-bar"></div>
      </div>
      <div class="pace-percentage" id="pace-percentage">0%</div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Pace.js progress handler -->
    <script>
      (function() {
        // Update custom progress bar based on Pace.js events
        const progressBar = document.getElementById('pace-progress-bar');
        const percentageText = document.getElementById('pace-percentage');
        
        if (typeof Pace !== 'undefined') {
          Pace.on('progress', function(progress) {
            if (progressBar) {
              progressBar.style.width = progress + '%';
            }
            if (percentageText) {
              percentageText.textContent = Math.round(progress) + '%';
            }
          });
          
          Pace.on('done', function() {
            if (percentageText) {
              percentageText.textContent = '100%';
            }
            if (progressBar) {
              progressBar.style.width = '100%';
            }
          });
        }
      })();
    </script>
  </body>
</html>
