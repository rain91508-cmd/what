name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 缓存 Rust 和 Cargo 以加速构建
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # 2. 为 Rust 添加 wasm32 target
      - name: Setup Rust Wasm Target
        run: rustup target add wasm32-unknown-unknown

      # 3. 极速安装 wasm-bindgen CLI (比 cargo install 快几分钟)
      - name: Install wasm-bindgen
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          # 可以指定版本，比如 '0.2.89'，'latest' 代表最新
          version: 'latest'

      # 4. 执行你自己的 Makefile 或编译命令
      - name: Build Rust to Wasm
        working-directory: web-client
        run: |
          cargo build --target wasm32-unknown-unknown --release
          wasm-bindgen target/wasm32-unknown-unknown/release/deps/hwda_wasm.wasm --out-dir wasm-pkg --target web

      # 5. Node.js 环境及前端 Vite 依赖
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install NPM dependencies
        working-directory: web-client
        run: npm ci

      - name: Copy static assets to public
        working-directory: web-client
        run: |
          # 创建目标文件夹（加 -p 防止目录已存在报错）
          mkdir -p public/wasm-pkg
          mkdir -p public/monaco-editor/min

          # 1. 复制 pace.js
          cp node_modules/pace-js/pace.min.js public/

          # 2. 复制编译好的 wasm 文件 (包含 .js 和 .wasm，所以用 -r)
          cp -r wasm-pkg/* public/wasm-pkg/

          # 3. 复制 monaco-editor 的 loader 和核心文件
          cp -r node_modules/monaco-editor/min/vs public/monaco-editor/

      # 6. Vite 生产构建 (触发配置里的 base 替换)
      - name: Build Vite App
        working-directory: web-client
        run: npm run build

      # 7. GitHub Pages 发布设置
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
