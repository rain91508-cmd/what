name: Build & Release Binaries

# Builds the native binaries (interpreter + server) and the web client, then
# uploads them as downloadable assets on a GitHub Release.
#
# The server package is self-contained: it bundles the compiled web client
# (./web) plus the example KDB/FST data (./kdb, ./waves), so a user can just
# run the extracted server and open the bundled web UI against the example.
#
# Release version is determined by the Git tag:
#   - On a pushed tag like `v1.0.0`  -> release is published as `v1.0.0`
#   - On manual `workflow_dispatch` -> use the "version" input; if left empty
#                                      it falls back to `nightly-<short-sha>`

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag, e.g. v1.0.0 (manual runs only; ignored on tag push)'
        required: false
        default: ''

permissions:
  contents: write   # needed to create the GitHub Release + upload assets

jobs:
  # ---------------------------------------------------------------------------
  # Web client (Node + Rust/wasm): produces the static ./web assets
  # ---------------------------------------------------------------------------
  build-web-client:
    name: Build web client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            web-client/target/
          key: ${{ runner.os }}-webclient-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-webclient-cargo-

      - name: Setup Rust toolchain (with wasm32 target)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          deny-warnings: false

      - name: Install wasm-bindgen CLI
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: 'latest'

      - name: Build Rust to Wasm
        working-directory: web-client
        run: |
          cargo build --target wasm32-unknown-unknown --release
          wasm-bindgen target/wasm32-unknown-unknown/release/deps/hwda_wasm.wasm \
            --out-dir wasm-pkg --target web

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install NPM dependencies
        working-directory: web-client
        run: npm ci

      - name: Copy static assets to public
        working-directory: web-client
        run: |
          mkdir -p public/wasm-pkg public/monaco-editor/min
          cp node_modules/pace-js/pace.min.js public/
          cp -r wasm-pkg/* public/wasm-pkg/
          cp -r node_modules/monaco-editor/min/vs public/monaco-editor/min/

      - name: Build Vite app
        working-directory: web-client
        run: npm run build

      - name: Upload web-dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-client/dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Interpreter (C++ / CMake): hwda_interpreter + kdb_viewer
  # ---------------------------------------------------------------------------
  build-interpreter:
    name: Build interpreter (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git \
            protobuf-compiler libprotobuf-dev libzstd-dev \
            python3 python3-pip pkg-config \
            default-jre-headless ccache

      # UHDM's build scripts (generate.py) require this Python package.
      # Ubuntu 24.04 pip is externally-managed, so --break-system-packages is needed.
      - name: Install Python dependencies (UHDM codegen)
        run: pip3 install --break-system-packages orderedmultidict

      # Surelog generates its SystemVerilog parser at build time by running the
      # ANTLR jar. That jar is NOT tracked in git (gitignored in the submodule),
      # so we must fetch it explicitly or the build fails.
      - name: Download ANTLR jar (required by Surelog build)
        run: |
          mkdir -p third_party/Surelog/third_party/antlr4_bin
          curl -fsSL https://www.antlr.org/download/antlr-4.13.2-complete.jar \
            -o third_party/Surelog/third_party/antlr4_bin/antlr-4.13.2-complete.jar

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: interpreter-${{ runner.os }}

      - name: Configure & Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target hwda_interpreter kdb_viewer -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist
          cp build/interpreter/hwda_interpreter dist/
          cp build/interpreter/kdb_viewer dist/
          tar -czf hwda-interpreter-linux-x86_64.tar.gz -C dist hwda_interpreter kdb_viewer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hwda-interpreter-linux
          path: hwda-interpreter-linux-x86_64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Server (Rust): hwda-server (Linux) + bundled web client + example data
  # ---------------------------------------------------------------------------
  build-server:
    name: Build server (Linux x86_64)
    runs-on: ubuntu-latest
    needs: [build-web-client]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libzstd-dev \
            llvm libclang-dev

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # fst-reader (a third_party submodule) has pre-existing warnings that
          # would otherwise be promoted to errors by the default -D warnings.
          deny-warnings: false

      - name: Download web-dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Build server
        run: cargo build --release --manifest-path server/Cargo.toml

      - name: Package (server + web client + example data)
        run: |
          mkdir -p pkg/web pkg/kdb pkg/waves
          BIN=$(find . -type f -path '*/release/hwda-server' | head -1)
          echo "Found server binary: $BIN"
          cp "$BIN" pkg/hwda-server
          cp -r web-dist/. pkg/web/
          cp server/examples/kdb/* pkg/kdb/
          cp server/examples/waves/* pkg/waves/
          tar -czf hwda-server-linux-x86_64.tar.gz -C pkg .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hwda-server-linux
          path: hwda-server-linux-x86_64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Server (Rust): hwda-server (Windows) + bundled web client + example data
  # ---------------------------------------------------------------------------
  build-server-windows:
    name: Build server (Windows x86_64)
    runs-on: windows-latest
    needs: [build-web-client]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # fstapi uses bindgen -> needs libclang (provided by LLVM).
      - name: Install LLVM (libclang for bindgen)
        shell: pwsh
        run: |
          winget install -e --id LLVM.LLVM --accept-package-agreements --accept-source-agreements
          $llvm = "${env:ProgramFiles}\LLVM\bin"
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$llvm"

      # fstapi (Windows) links zlib / pthreads / mman via vcpkg.
      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:USERPROFILE\vcpkg"
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat"
          & "$env:USERPROFILE\vcpkg\vcpkg.exe" install zlib pthreads mman --triplet x64-windows
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:USERPROFILE\vcpkg"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          deny-warnings: false

      - name: Download web-dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Build server
        run: cargo build --release --manifest-path server/Cargo.toml

      - name: Package (server + web client + example data)
        shell: pwsh
        run: |
          $bin = (Get-ChildItem -Path server/target/release/hwda-server.exe -Recurse | Select-Object -First 1).FullName
          Write-Host "Found server binary: $bin"
          New-Item -ItemType Directory -Force -Path pkg/web, pkg/kdb, pkg/waves | Out-Null
          Copy-Item $bin pkg/hwda-server.exe
          Copy-Item -Recurse -Force web-dist/* pkg/web/
          Copy-Item -Recurse -Force server/examples/kdb/* pkg/kdb/
          Copy-Item -Recurse -Force server/examples/waves/* pkg/waves/
          Compress-Archive -Path pkg/* -DestinationPath hwda-server-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hwda-server-windows
          path: hwda-server-windows-x86_64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish GitHub Release with all assets attached
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-interpreter, build-server, build-server-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="nightly-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: HWDA ${{ steps.version.outputs.version }}
          files: |
            artifacts/hwda-interpreter-linux/hwda-interpreter-linux-x86_64.tar.gz
            artifacts/hwda-server-linux/hwda-server-linux-x86_64.tar.gz
            artifacts/hwda-server-windows/hwda-server-windows-x86_64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
