name: Build & Release Binaries

# Builds the native binaries (interpreter + server) and uploads them as
# downloadable assets on a GitHub Release.
#
# Release version is determined by the Git tag:
#   - On a pushed tag like `v1.0.0`  -> release is published as `v1.0.0`
#   - On manual `workflow_dispatch` -> use the "version" input; if left empty
#                                      it falls back to `nightly-<short-sha>`

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag, e.g. v1.0.0 (manual runs only; ignored on tag push)'
        required: false
        default: ''

permissions:
  contents: write   # needed to create the GitHub Release + upload assets

jobs:
  # ---------------------------------------------------------------------------
  # Interpreter (C++ / CMake): hwda_interpreter + kdb_viewer
  # ---------------------------------------------------------------------------
  build-interpreter:
    name: Build interpreter (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git \
            protobuf-compiler libprotobuf-dev libzstd-dev \
            python3 python3-pip pkg-config \
            default-jre-headless ccache

      # Surelog generates its SystemVerilog parser at build time by running the
      # ANTLR jar. That jar is NOT tracked in git (gitignored in the submodule),
      # so we must fetch it explicitly or the build fails.
      - name: Download ANTLR jar (required by Surelog build)
        run: |
          mkdir -p third_party/Surelog/third_party/antlr4_bin
          curl -fsSL https://www.antlr.org/download/antlr-4.13.2-complete.jar \
            -o third_party/Surelog/third_party/antlr4_bin/antlr-4.13.2-complete.jar

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: interpreter-${{ runner.os }}

      - name: Configure & Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target hwda_interpreter kdb_viewer -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist
          cp build/interpreter/hwda_interpreter dist/
          cp build/interpreter/kdb_viewer dist/
          tar -czf hwda-interpreter-linux-x86_64.tar.gz -C dist hwda_interpreter kdb_viewer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hwda-interpreter-linux
          path: hwda-interpreter-linux-x86_64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Server (Rust): hwda-server
  # ---------------------------------------------------------------------------
  build-server:
    name: Build server (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libzstd-dev \
            llvm libclang-dev

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build server
        run: cargo build --release --manifest-path server/Cargo.toml

      - name: Package
        run: |
          mkdir -p dist
          BIN=$(find . -type f -path '*/release/hwda-server' | head -1)
          echo "Found server binary: $BIN"
          cp "$BIN" dist/
          tar -czf hwda-server-linux-x86_64.tar.gz -C dist hwda-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hwda-server-linux
          path: hwda-server-linux-x86_64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish GitHub Release with both binaries attached
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-interpreter, build-server]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="nightly-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: HWDA ${{ steps.version.outputs.version }}
          files: |
            artifacts/hwda-interpreter-linux/hwda-interpreter-linux-x86_64.tar.gz
            artifacts/hwda-server-linux/hwda-server-linux-x86_64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
