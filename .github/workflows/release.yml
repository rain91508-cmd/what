name: Build & Release Binaries

# Builds the native binaries (interpreter + server) and the web client, then
# uploads them as downloadable assets on a GitHub Release.
#
# The server package is self-contained: it bundles the compiled web client
# (./web) plus the example KDB data (./kdb). Example wave (FST) data is
# optional - it is only bundled if present (./waves) - so a user can just
# run the extracted server and open the bundled web UI against the example.
#
# Release version is determined by the Git tag:
#   - On a pushed tag like `v1.0.0`  -> release is published as `v1.0.0`
#   - On manual `workflow_dispatch` -> use the "version" input; if left empty
#                                      it falls back to `nightly-<short-sha>`

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag, e.g. v1.0.0 (manual runs only; ignored on tag push)'
        required: false
        default: ''

permissions:
  contents: write   # needed to create the GitHub Release + upload assets

jobs:
  # ---------------------------------------------------------------------------
  # Web client (Node + Rust/wasm): produces the static ./web assets
  # ---------------------------------------------------------------------------
  build-web-client:
    name: Build web client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            web-client/target/
          key: ${{ runner.os }}-webclient-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-webclient-cargo-

      - name: Setup Rust toolchain (with wasm32 target)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          rustflags: ""

      - name: Install wasm-bindgen CLI
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: 'latest'

      - name: Build Rust to Wasm
        working-directory: web-client
        run: |
          cargo build --target wasm32-unknown-unknown --release
          wasm-bindgen target/wasm32-unknown-unknown/release/deps/hwda_wasm.wasm \
            --out-dir wasm-pkg --target web

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install NPM dependencies
        working-directory: web-client
        run: npm ci

      - name: Build Vite app
        working-directory: web-client
        # prebuild script copies pace.min.js, monaco-editor/min/vs and wasm-pkg into public/
        run: npm run build

      - name: Upload web-dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-client/dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Interpreter (C++ / CMake): what_interpreter + kdb_viewer
  # ---------------------------------------------------------------------------
  build-interpreter:
    name: Build interpreter (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git ninja-build \
            libzstd-dev \
            python3 python3-pip pkg-config \
            default-jre-headless ccache

      # UHDM's build scripts (generate.py) require this Python package.
      # Ubuntu 24.04 pip is externally-managed, so --break-system-packages is needed.
      - name: Install Python dependencies (UHDM codegen)
        run: pip3 install --break-system-packages orderedmultidict

      # Surelog generates its SystemVerilog parser at build time by running the
      # ANTLR jar. That jar is NOT tracked in git (gitignored in the submodule),
      # so we must fetch it explicitly or the build fails.
      - name: Download ANTLR jar (required by Surelog build)
        run: |
          mkdir -p third_party/Surelog/third_party/antlr4_bin
          curl -fsSL https://www.antlr.org/download/antlr-4.13.2-complete.jar \
            -o third_party/Surelog/third_party/antlr4_bin/antlr-4.13.2-complete.jar

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: interpreter-${{ runner.os }}

      # -------------------------------------------------------------------------
      # Pin Cap'n Proto + Protobuf to the ABI-matched versions Surelog/UHDM were
      # developed against. The interpreter links the Cap'n Proto *runtime* and a
      # Protobuf *runtime* that MUST match what Surelog/UHDM expect, otherwise
      # you get subtle ABI mismatches (Ubuntu ships capnp 1.0.1, which is wrong).
      # Surelog bundles Cap'n Proto 1.1-dev; we pin Protobuf to 3.21.12. Build a
      # *native host* copy of each (codegen compiler + runtime) and point the
      # interpreter CMake at it. Staged OUTSIDE the repo tree because CMake
      # rejects imported-target include dirs that live inside the source/build
      # dir. This mirrors the local `cross-build-win.sh` host toolchain layout.
      # -------------------------------------------------------------------------
      - name: Build host Cap'n Proto (1.1-dev, from bundled source)
        run: |
          HOST_TOOLING="${GITHUB_WORKSPACE}/../cross-tooling"
          CAPNP_HOST="$HOST_TOOLING/capnp-host"
          mkdir -p "$CAPNP_HOST"
          cmake -S third_party/Surelog/third_party/UHDM/third_party/capnproto/c++ \
            -B /tmp/capnp-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DBUILD_SHARED_LIBS=OFF \
            -DWITH_OPENSSL=OFF -DWITH_ZLIB=OFF \
            -DCMAKE_INSTALL_PREFIX="$CAPNP_HOST"
          cmake --build /tmp/capnp-host-build -j"$(nproc)"
          cmake --install /tmp/capnp-host-build

      - name: Build host Protobuf (3.21.12)
        run: |
          HOST_TOOLING="${GITHUB_WORKSPACE}/../cross-tooling"
          PROTO_HOST="$HOST_TOOLING/proto-host"
          mkdir -p "$PROTO_HOST"
          curl -fsSL https://github.com/protocolbuffers/protobuf/archive/refs/tags/v3.21.12.tar.gz \
            | tar xz -C /tmp
          cmake -S /tmp/protobuf-3.21.12 -B /tmp/proto-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_SHARED_LIBS=OFF \
            -Dprotobuf_WITH_ZLIB=OFF \
            -Dprotobuf_BUILD_PROTOC_BINARIES=ON \
            -DCMAKE_INSTALL_PREFIX="$PROTO_HOST"
          cmake --build /tmp/proto-host-build -j"$(nproc)"
          cmake --install /tmp/proto-host-build

      - name: Configure & Build
        run: |
          HOST_TOOLING="${GITHUB_WORKSPACE}/../cross-tooling"
          CAPNP_HOST="$HOST_TOOLING/capnp-host"
          PROTO_HOST="$HOST_TOOLING/proto-host"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$CAPNP_HOST;$PROTO_HOST" \
            -DCapnProto_DIR="$CAPNP_HOST/lib/cmake/CapnProto" \
            -DProtobuf_DIR="$PROTO_HOST/lib/cmake/protobuf" \
            -DCAPNP_EXECUTABLE="$CAPNP_HOST/bin/capnp" \
            -DCAPNPC_CXX_EXECUTABLE="$CAPNP_HOST/bin/capnpc-c++" \
            -DProtobuf_PROTOC_EXECUTABLE="$PROTO_HOST/bin/protoc" \
            -DBUILD_INTERPRETER=ON -DBUILD_TESTS=OFF -DBUILD_SURELOG=ON \
            -DSURELOG_WITH_TCMALLOC=OFF -DSURELOG_USE_HOST_CAPNP=ON -DUHDM_USE_HOST_CAPNP=ON
          cmake --build build --target what_interpreter kdb_viewer -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist
          cp build/interpreter/what_interpreter dist/
          cp build/interpreter/kdb_viewer dist/
          tar -czf what-interpreter-linux-x86_64.tar.gz -C dist what_interpreter kdb_viewer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: what-interpreter-linux
          path: what-interpreter-linux-x86_64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Interpreter (native, ARM64 Linux): what_interpreter + kdb_viewer
  # Same build/toolchain as the x86_64 Linux job, just run on an aarch64 runner.
  # ---------------------------------------------------------------------------
  build-interpreter-linux-arm64:
    name: Build interpreter (Linux arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git ninja-build \
            libzstd-dev \
            python3 python3-pip pkg-config \
            default-jre-headless ccache

      # UHDM's build scripts (generate.py) require this Python package.
      # Ubuntu 24.04 pip is externally-managed, so --break-system-packages is needed.
      - name: Install Python dependencies (UHDM codegen)
        run: pip3 install --break-system-packages orderedmultidict

      # Surelog generates its SystemVerilog parser at build time by running the
      # ANTLR jar. That jar is NOT tracked in git (gitignored in the submodule),
      # so we must fetch it explicitly or the build fails.
      - name: Download ANTLR jar (required by Surelog build)
        run: |
          mkdir -p third_party/Surelog/third_party/antlr4_bin
          curl -fsSL https://www.antlr.org/download/antlr-4.13.2-complete.jar \
            -o third_party/Surelog/third_party/antlr4_bin/antlr-4.13.2-complete.jar

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: interpreter-arm64

      # -------------------------------------------------------------------------
      # Pin Cap'n Proto + Protobuf to the ABI-matched versions Surelog/UHDM were
      # developed against (see x86_64 Linux job for the full rationale).
      # -------------------------------------------------------------------------
      - name: Build host Cap'n Proto (1.1-dev, from bundled source)
        run: |
          HOST_TOOLING="${GITHUB_WORKSPACE}/../cross-tooling"
          CAPNP_HOST="$HOST_TOOLING/capnp-host"
          mkdir -p "$CAPNP_HOST"
          cmake -S third_party/Surelog/third_party/UHDM/third_party/capnproto/c++ \
            -B /tmp/capnp-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DBUILD_SHARED_LIBS=OFF \
            -DWITH_OPENSSL=OFF -DWITH_ZLIB=OFF \
            -DCMAKE_INSTALL_PREFIX="$CAPNP_HOST"
          cmake --build /tmp/capnp-host-build -j"$(nproc)"
          cmake --install /tmp/capnp-host-build

      - name: Build host Protobuf (3.21.12)
        run: |
          HOST_TOOLING="${GITHUB_WORKSPACE}/../cross-tooling"
          PROTO_HOST="$HOST_TOOLING/proto-host"
          mkdir -p "$PROTO_HOST"
          curl -fsSL https://github.com/protocolbuffers/protobuf/archive/refs/tags/v3.21.12.tar.gz \
            | tar xz -C /tmp
          cmake -S /tmp/protobuf-3.21.12 -B /tmp/proto-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_SHARED_LIBS=OFF \
            -Dprotobuf_WITH_ZLIB=OFF \
            -Dprotobuf_BUILD_PROTOC_BINARIES=ON \
            -DCMAKE_INSTALL_PREFIX="$PROTO_HOST"
          cmake --build /tmp/proto-host-build -j"$(nproc)"
          cmake --install /tmp/proto-host-build

      - name: Configure & Build
        run: |
          HOST_TOOLING="${GITHUB_WORKSPACE}/../cross-tooling"
          CAPNP_HOST="$HOST_TOOLING/capnp-host"
          PROTO_HOST="$HOST_TOOLING/proto-host"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$CAPNP_HOST;$PROTO_HOST" \
            -DCapnProto_DIR="$CAPNP_HOST/lib/cmake/CapnProto" \
            -DProtobuf_DIR="$PROTO_HOST/lib/cmake/protobuf" \
            -DCAPNP_EXECUTABLE="$CAPNP_HOST/bin/capnp" \
            -DCAPNPC_CXX_EXECUTABLE="$CAPNP_HOST/bin/capnpc-c++" \
            -DProtobuf_PROTOC_EXECUTABLE="$PROTO_HOST/bin/protoc" \
            -DBUILD_INTERPRETER=ON -DBUILD_TESTS=OFF -DBUILD_SURELOG=ON \
            -DSURELOG_WITH_TCMALLOC=OFF -DSURELOG_USE_HOST_CAPNP=ON -DUHDM_USE_HOST_CAPNP=ON
          cmake --build build --target what_interpreter kdb_viewer -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist
          cp build/interpreter/what_interpreter dist/
          cp build/interpreter/kdb_viewer dist/
          tar -czf what-interpreter-linux-arm64.tar.gz -C dist what_interpreter kdb_viewer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: what-interpreter-linux-arm64
          path: what-interpreter-linux-arm64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Interpreter (cross-compile, MinGW-w64 -> Windows): what_interpreter.exe + kdb_viewer.exe
  # Built on Linux via cross-build-win.sh (mirrors the local Windows cross build).
  # ---------------------------------------------------------------------------
  build-interpreter-windows:
    name: Build interpreter (Windows x86_64, cross)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (MinGW-w64 cross toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 mingw-w64-tools \
            capnproto libcapnp-dev libz-mingw-w64-dev zip \
            default-jre-headless build-essential cmake ninja-build \
            pkg-config git python3 python3-pip curl

      # UHDM's build scripts (generate.py) require this Python package.
      # Ubuntu 24.04 pip is externally-managed, so --break-system-packages is needed.
      - name: Install Python dependencies (UHDM codegen)
        run: pip3 install --break-system-packages orderedmultidict

      # cross-build-win.sh builds a pinned host Protobuf 3.21.12 from source;
      # fetch that source into the location the script expects
      # ($ROOT/../cross-tooling/src/protobuf-3.21.12).
      - name: Fetch Protobuf 3.21.12 source
        run: |
          SRC_DIR="${GITHUB_WORKSPACE}/../cross-tooling/src"
          mkdir -p "$SRC_DIR"
          curl -fsSL https://github.com/protocolbuffers/protobuf/archive/refs/tags/v3.21.12.tar.gz \
            | tar xz -C "$SRC_DIR"

      # cross-build-win.sh builds the host+target capnp/protobuf toolchain,
      # applies the Surelog MinGW patch, configures and builds the Windows
      # interpreter (what_interpreter.exe, kdb_viewer.exe) into build-win/.
      - name: Cross-build interpreter for Windows
        run: bash ./cross-build-win.sh

      - name: Package
        run: |
          mkdir -p dist
          cp build-win/interpreter/what_interpreter.exe dist/
          cp build-win/interpreter/kdb_viewer.exe dist/
          (cd dist && zip -r ../what-interpreter-windows-x86_64.zip what_interpreter.exe kdb_viewer.exe)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: what-interpreter-windows
          path: what-interpreter-windows-x86_64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Server (Rust): what-server (Linux) + bundled web client + example data
  # ---------------------------------------------------------------------------
  build-server:
    name: Build server (Linux x86_64)
    runs-on: ubuntu-latest
    needs: [build-web-client]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libzstd-dev \
            llvm libclang-dev

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # fst-reader (a third_party submodule) has pre-existing warnings that
          # would otherwise be promoted to errors by the default -D warnings.
          rustflags: ""

      - name: Download web-dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Build server
        run: cargo build --release --manifest-path server/Cargo.toml

      - name: Package (server + web client + example data)
        run: |
          mkdir -p pkg/web pkg/kdb pkg/waves
          BIN=$(find . -type f -path '*/release/what-server' | head -1)
          echo "Found server binary: $BIN"
          cp "$BIN" pkg/what-server
          cp -r web-dist/. pkg/web/
          cp server/examples/kdb/* pkg/kdb/
          # waves are optional: the example .fst files may have been removed.
          if compgen -G "server/examples/waves/*" > /dev/null; then
            cp server/examples/waves/* pkg/waves/
          else
            echo "No example waves found, packaging without them."
          fi
          tar -czf what-server-linux-x86_64.tar.gz -C pkg .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: what-server-linux
          path: what-server-linux-x86_64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Server (Rust): what-server (Linux arm64) + bundled web client + example data
  # Same as the x86_64 Linux server job, just run on an aarch64 runner.
  # ---------------------------------------------------------------------------
  build-server-linux-arm64:
    name: Build server (Linux arm64)
    runs-on: ubuntu-24.04-arm
    needs: [build-web-client]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libzstd-dev \
            llvm libclang-dev

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # fst-reader (a third_party submodule) has pre-existing warnings that
          # would otherwise be promoted to errors by the default -D warnings.
          rustflags: ""

      - name: Download web-dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Build server
        run: cargo build --release --manifest-path server/Cargo.toml

      - name: Package (server + web client + example data)
        run: |
          mkdir -p pkg/web pkg/kdb pkg/waves
          BIN=$(find . -type f -path '*/release/what-server' | head -1)
          echo "Found server binary: $BIN"
          cp "$BIN" pkg/what-server
          cp -r web-dist/. pkg/web/
          cp server/examples/kdb/* pkg/kdb/
          # waves are optional: the example .fst files may have been removed.
          if compgen -G "server/examples/waves/*" > /dev/null; then
            cp server/examples/waves/* pkg/waves/
          else
            echo "No example waves found, packaging without them."
          fi
          tar -czf what-server-linux-arm64.tar.gz -C pkg .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: what-server-linux-arm64
          path: what-server-linux-arm64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Server (Rust): what-server (Windows) + bundled web client + example data
  # ---------------------------------------------------------------------------
  build-server-windows:
    name: Build server (Windows x86_64)
    runs-on: windows-latest
    needs: [build-web-client]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # fstapi uses bindgen -> needs libclang (provided by LLVM).
      - name: Install LLVM (libclang for bindgen)
        shell: pwsh
        run: |
          winget install -e --id LLVM.LLVM --accept-package-agreements --accept-source-agreements
          $llvm = "${env:ProgramFiles}\LLVM\bin"
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$llvm"

      # fstapi (Windows) links zlib / pthreads / mman via vcpkg.
      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:USERPROFILE\vcpkg"
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat"
          & "$env:USERPROFILE\vcpkg\vcpkg.exe" install zlib pthreads mman --triplet x64-windows-static-md
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:USERPROFILE\vcpkg"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Download web-dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Build server
        run: cargo build --release --manifest-path server/Cargo.toml

      - name: Package (server + web client + example data)
        shell: pwsh
        run: |
          $bin = (Get-ChildItem -Path server/target/release/what-server.exe -Recurse | Select-Object -First 1).FullName
          Write-Host "Found server binary: $bin"
          New-Item -ItemType Directory -Force -Path pkg/web, pkg/kdb, pkg/waves | Out-Null
          Copy-Item $bin pkg/what-server.exe
          Copy-Item -Recurse -Force web-dist/* pkg/web/
          Copy-Item -Recurse -Force server/examples/kdb/* pkg/kdb/
          # waves are optional: the example .fst files may have been removed.
          if (Test-Path server/examples/waves/*) {
            Copy-Item -Recurse -Force server/examples/waves/* pkg/waves/
          } else {
            Write-Host "No example waves found, packaging without them."
          }
          Compress-Archive -Path pkg/* -DestinationPath what-server-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: what-server-windows
          path: what-server-windows-x86_64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish GitHub Release with all assets attached
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-interpreter, build-interpreter-linux-arm64, build-interpreter-windows, build-server, build-server-linux-arm64, build-server-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="nightly-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: WHAT ${{ steps.version.outputs.version }}
          files: |
            artifacts/what-interpreter-linux/what-interpreter-linux-x86_64.tar.gz
            artifacts/what-interpreter-linux-arm64/what-interpreter-linux-arm64.tar.gz
            artifacts/what-interpreter-windows/what-interpreter-windows-x86_64.zip
            artifacts/what-server-linux/what-server-linux-x86_64.tar.gz
            artifacts/what-server-linux-arm64/what-server-linux-arm64.tar.gz
            artifacts/what-server-windows/what-server-windows-x86_64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
