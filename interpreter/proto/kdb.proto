syntax = "proto3";

package hwda.kdb;

option cc_enable_arenas = true;

message KDBHeader {
  string version = 1;
  string project_name = 2;
  string created_at = 3;
}

message SourceFile {
  uint32 id = 1;  // Changed from uint64 to uint32
  string path = 2;
  string content = 3;
}

message SourceLocation {
  uint32 file_id = 1;  // Changed from uint64 to uint32
  uint32 line = 2;
  // Note: column_start and column_end removed - not needed
}

message ModuleSourceLocation {
  uint32 file_id = 1;
  uint32 start_line = 2;
  uint32 end_line = 3;
}

enum SignalType {
  SIGNAL_TYPE_UNKNOWN = 0;
  SIGNAL_TYPE_WIRE = 1;
  SIGNAL_TYPE_REG = 2;
  SIGNAL_TYPE_LOGIC = 3;
  SIGNAL_TYPE_BIT = 4;
  SIGNAL_TYPE_INTEGER = 5;
  SIGNAL_TYPE_REAL = 6;
  SIGNAL_TYPE_PARAMETER = 7;
  SIGNAL_TYPE_LOCALPARAM = 8;
  // Note: INPUT, OUTPUT, INOUT are removed
  // Use PortDirection to represent signal direction
}

enum PortDirection {
  PORT_DIR_UNKNOWN = 0;
  PORT_DIR_INPUT = 1;
  PORT_DIR_OUTPUT = 2;
  PORT_DIR_INOUT = 3;
}

// Port information is now integrated into Signal
// See the direction field in Signal message below

message Signal {
  uint64 id = 1;  // Keep uint64 for signal IDs (can be many signals)
  string name = 2;
  string full_name = 3;
  SignalType type = 4;
  uint32 msb = 5;
  uint32 lsb = 6;
  uint32 parent_module_id = 7;  // Changed from uint64 to uint32
  SourceLocation declaration = 8;
  repeated uint64 driver_signal_ids = 9;
  // Note: load_signal_ids removed - not needed
  PortDirection direction = 10;  // Direction of the signal: INPUT, OUTPUT, INOUT, or UNKNOWN for internal signals
  repeated SourceLocation driver_lines = 11;  // Source locations where drivers are discovered (using SourceLocation instead of DriverLocation)
}

message Module {
  uint32 id = 1;  // Changed from uint64 to uint32
  string name = 2;
  string full_name = 3;
  uint32 parent_module_id = 4;  // Changed from uint64 to uint32
  // Note: file_id removed, use definition.file_id instead
  ModuleSourceLocation definition = 5;
  repeated Signal signals = 6;  // Contains both ports and internal signals
  bool is_instance = 7;
  repeated uint32 child_module_ids = 8;  // Direct child module IDs for hierarchy traversal
  uint32 def_module_id = 9;  // Definition module ID for instances (0 if this is a definition)
}

message DesignHierarchy {
  uint32 top_module_id = 1;  // Changed from uint64 to uint32
  repeated uint32 module_ids = 2;  // Changed from uint64 to uint32
}

message KnowledgeBase {
  KDBHeader header = 1;
  repeated SourceFile files = 2;
  repeated Module modules = 3;
  repeated DesignHierarchy hierarchies = 4;
}
