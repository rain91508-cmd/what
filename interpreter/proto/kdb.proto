syntax = "proto3";

package hwda.kdb;

option cc_enable_arenas = true;

message KDBHeader {
  string version = 1;
  string project_name = 2;
  string created_at = 3;
}

// Source file content - stored as byte array (UTF-8 encoded)
// Note: id removed, use array index + 1 as implicit ID
message SourceFileContent {
  bytes content = 1;  // UTF-8 encoded file content
}

// Source file metadata - for quick access without loading content
// Note: id removed, use array index + 1 as implicit ID
message SourceFileInfo {
  string path = 1;
  uint32 total_lines = 2;  // Total number of lines in the source file
  // Line index for fast seeking: line_index_offset[n] = byte offset of line (256*n + 1)
  // For example: line_index_offset[0] = offset of line 1, line_index_offset[1] = offset of line 257
  repeated uint32 line_index_offset = 3;
}

message SourceLocation {
  uint32 file_id = 1;  // Changed from uint64 to uint32
  uint32 line = 2;
  // Note: column_start and column_end removed - not needed
}

message ModuleSourceLocation {
  uint32 file_id = 1;
  uint32 start_line = 2;
  uint32 end_line = 3;
}

enum SignalType {
  SIGNAL_TYPE_UNKNOWN = 0;
  SIGNAL_TYPE_WIRE = 1;
  SIGNAL_TYPE_REG = 2;
  SIGNAL_TYPE_LOGIC = 3;
  SIGNAL_TYPE_BIT = 4;
  SIGNAL_TYPE_INTEGER = 5;
  SIGNAL_TYPE_REAL = 6;
  SIGNAL_TYPE_PARAMETER = 7;
  SIGNAL_TYPE_LOCALPARAM = 8;
  // Note: INPUT, OUTPUT, INOUT are removed
  // Use PortDirection to represent signal direction
}

enum PortDirection {
  PORT_DIR_UNKNOWN = 0;
  PORT_DIR_INPUT = 1;
  PORT_DIR_OUTPUT = 2;
  PORT_DIR_INOUT = 3;
}

// Port information is now integrated into Signal
// See the direction field in Signal message below

// Signal definition - shared between Definition and Instance
// Note: id removed, use array index as local index
message SignalDef {
  // uint64 id = 1;  // REMOVED: Use array index as local index
  string name = 2;  // Signal name (e.g., "mem_arvalid")
  SignalType type = 3;
  SourceLocation declaration = 4;
  PortDirection direction = 5;  // INPUT, OUTPUT, INOUT, or UNKNOWN for internal signals
}

// Driver location - combines signal ID and source location
// Note: no id needed, stored as repeated field in SignalInst
message DriverLocation {
  uint64 driver_signal_global_id = 1;  // Global ID in all_signal_insts array
  uint32 line = 2;  // Source line; always lives in the driver's defModule (declaration) file
}

// Signal instance - specific to each module instance
// Note: id removed, use module's signal_insts_start_id + array index as global id
// Note: full_name removed - dynamically reconstructed from module hierarchy + signal_def.name
//
// Driver locations are no longer nested per-signal. They live in one flat global
// array (KnowledgeBase.all_driver_locations) and each signal references its slice
// via (driver_start, driver_count). This mirrors the on-device OPFS layout: two
// flat binary arrays (signals.bin + drivers.bin) that can be streamed to storage
// without per-record structuring, and read back by a single O(1) range lookup.
message SignalInst {
  // uint64 id = 1;  // REMOVED: Use global signal insts array index
  // string full_name = 2;  // REMOVED: Dynamically reconstructed
  uint32 msb = 3;
  uint32 lsb = 4;
  uint32 parent_module_id = 5;  // Module instance ID that owns this signal
  // Slice into KnowledgeBase.all_driver_locations for this signal's drivers.
  uint32 driver_start = 6;  // Entry index of the first driver in all_driver_locations
  // Number of drivers. Semantically a u16 (stored as 2 bytes in the OPFS
  // signals.bin record); kept as uint32 here because proto3 has no u16.
  uint32 driver_count = 7;
}



message Module {
  // Note: id removed, use array index + 1 as implicit ID
  string name = 1;  // Instance: VpiName(), Definition: VpiDefName()
  // Note: full_name removed, reconstruct from hierarchy if needed
  uint32 parent_module_id = 2;  // 0 for top-level modules
  // Note: file_id removed, use definition.file_id instead
  ModuleSourceLocation definition = 3;
  // New: Split signals into definition (shared) and instance (specific)
  repeated SignalDef signal_defs = 4;  // Signal definitions (shared)
  // Note: signal_insts moved to KnowledgeBase level for memory optimization
  // repeated SignalInst signal_insts = 5;  // MOVED to KnowledgeBase.all_signal_insts
  bool is_instance = 6;
  repeated uint32 child_module_ids = 7;  // Direct child module IDs for hierarchy traversal
  uint32 def_module_id = 8;  // Definition module ID for instances (0 if this is a definition)
  // Note: def_name removed - can be obtained from def_module_id's module name
  uint32 signal_insts_start_id = 9;  // Start index in KnowledgeBase.all_signal_insts
  // Note: signal_insts_count removed - can be derived from signal_defs.size() or def_module's signal_defs.size()
}

message DesignHierarchy {
  uint32 top_module_id = 1;  // Changed from uint64 to uint32
  repeated uint32 module_ids = 2;  // Changed from uint64 to uint32
}

message KnowledgeBase {
  KDBHeader header = 1;
  // Note: SourceFile split into SourceFileInfo and SourceFileContent
  repeated SourceFileInfo file_infos = 2;      // File metadata (path, total_lines, line_index_offset)
  repeated SourceFileContent file_contents = 3; // File content (UTF-8 byte arrays)
  repeated Module modules = 4;
  repeated DesignHierarchy hierarchies = 5;
  // Global signal instances array for memory optimization
  repeated SignalInst all_signal_insts = 6;  // All signal instances from all modules
  // Flat global driver-location array. Each SignalInst references its own slice
  // via (driver_start, driver_count). Stored contiguously in signal order so the
  // slices are laid out sequentially and map 1:1 onto the OPFS drivers.bin file.
  repeated DriverLocation all_driver_locations = 7;
}
