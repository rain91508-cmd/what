syntax = "proto3";

package hwda.kdb;

option cc_enable_arenas = true;

message KDBHeader {
  string version = 1;
  string project_name = 2;
  string created_at = 3;
}

message SourceLink {
  uint32 line = 1;
  uint32 column_start = 2;
  uint32 column_end = 3;
  uint64 target_id = 4;
}

message SourceFile {
  uint64 id = 1;
  string path = 2;
  string content = 3;
  repeated SourceLink signal_links = 4;  // Contains both port and internal signal links
  repeated SourceLink submod_links = 5;
  // Note: port_links removed - ports are now stored in signals with direction != UNKNOWN
}

message SourceLocation {
  uint64 file_id = 1;
  uint32 line = 2;
  uint32 column_start = 3;
  uint32 column_end = 4;
}

enum SignalType {
  SIGNAL_TYPE_UNKNOWN = 0;
  SIGNAL_TYPE_WIRE = 1;
  SIGNAL_TYPE_REG = 2;
  SIGNAL_TYPE_LOGIC = 3;
  SIGNAL_TYPE_BIT = 4;
  SIGNAL_TYPE_INTEGER = 5;
  SIGNAL_TYPE_REAL = 6;
  SIGNAL_TYPE_PARAMETER = 7;
  SIGNAL_TYPE_LOCALPARAM = 8;
  // Note: INPUT, OUTPUT, INOUT are removed
  // Use PortDirection to represent signal direction
}

enum PortDirection {
  PORT_DIR_UNKNOWN = 0;
  PORT_DIR_INPUT = 1;
  PORT_DIR_OUTPUT = 2;
  PORT_DIR_INOUT = 3;
}

// Port information is now integrated into Signal
// See the direction field in Signal message below

message Signal {
  uint64 id = 1;
  string name = 2;
  string full_name = 3;
  SignalType type = 4;
  uint32 msb = 5;
  uint32 lsb = 6;
  uint64 parent_module_id = 7;
  SourceLocation declaration = 8;
  repeated uint64 driver_signal_ids = 9;
  repeated uint64 load_signal_ids = 10;
  PortDirection direction = 11;  // Direction of the signal: INPUT, OUTPUT, INOUT, or UNKNOWN for internal signals
}

message Module {
  uint64 id = 1;
  string name = 2;
  string full_name = 3;
  uint64 parent_module_id = 4;
  uint64 file_id = 5;
  SourceLocation declaration = 6;
  repeated Signal signals = 7;  // Contains both ports and internal signals
  bool is_instance = 8;
}

message DesignHierarchy {
  uint64 top_module_id = 1;
  repeated uint64 module_ids = 2;
}

message KnowledgeBase {
  KDBHeader header = 1;
  repeated SourceFile files = 2;
  repeated Module modules = 3;
  repeated DesignHierarchy hierarchies = 4;
}
