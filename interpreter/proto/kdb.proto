syntax = "proto3";

package hwda.kdb;

option cc_enable_arenas = true;

message KDBHeader {
  string version = 1;
  string project_name = 2;
  string created_at = 3;
}

message SourceLink {
  uint32 line = 1;
  uint32 column_start = 2;
  uint32 column_end = 3;
  uint64 target_id = 4;
}

message SourceFile {
  uint64 id = 1;
  string path = 2;
  string content = 3;
  repeated SourceLink signal_links = 4;
  repeated SourceLink submod_links = 5;
  repeated SourceLink port_links = 6;
}

message SourceLocation {
  uint64 file_id = 1;
  uint32 line = 2;
  uint32 column_start = 3;
  uint32 column_end = 4;
}

enum SignalType {
  SIGNAL_TYPE_UNKNOWN = 0;
  SIGNAL_TYPE_WIRE = 1;
  SIGNAL_TYPE_REG = 2;
  SIGNAL_TYPE_LOGIC = 3;
  SIGNAL_TYPE_BIT = 4;
  SIGNAL_TYPE_INTEGER = 5;
  SIGNAL_TYPE_REAL = 6;
  SIGNAL_TYPE_PARAMETER = 7;
  SIGNAL_TYPE_LOCALPARAM = 8;
  SIGNAL_TYPE_INPUT = 9;
  SIGNAL_TYPE_OUTPUT = 10;
  SIGNAL_TYPE_INOUT = 11;
}

enum PortDirection {
  PORT_DIR_UNKNOWN = 0;
  PORT_DIR_INPUT = 1;
  PORT_DIR_OUTPUT = 2;
  PORT_DIR_INOUT = 3;
}

message Port {
  uint64 id = 1;
  string name = 2;
  PortDirection direction = 3;
  SignalType type = 4;
  uint32 msb = 5;
  uint32 lsb = 6;
  uint64 connected_signal_id = 7;
  SourceLocation declaration = 8;
}

message Signal {
  uint64 id = 1;
  string name = 2;
  string full_name = 3;
  SignalType type = 4;
  uint32 msb = 5;
  uint32 lsb = 6;
  uint64 parent_module_id = 7;
  SourceLocation declaration = 8;
  repeated uint64 driver_signal_ids = 9;
  repeated uint64 load_signal_ids = 10;
}

message Module {
  uint64 id = 1;
  string name = 2;
  string full_name = 3;
  uint64 parent_module_id = 4;
  uint64 file_id = 5;
  SourceLocation declaration = 6;
  repeated Port ports = 7;
  repeated Signal signals = 8;
}

message DesignHierarchy {
  uint64 top_module_id = 1;
  repeated uint64 module_ids = 2;
}

message KnowledgeBase {
  KDBHeader header = 1;
  repeated SourceFile files = 2;
  repeated Module modules = 3;
  repeated DesignHierarchy hierarchies = 4;
}
